name: CI

# One run per push: no pull_request trigger, because a push to a PR branch already runs this
# (a second run on the merge ref doubled the minutes). Docs-only pushes are skipped.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Regenerate the visual baselines and upload them as an artifact (docs/design/VISUAL_TESTS.md)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the gallery job is needed. Pushes to main and manual runs always run it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gallery: ${{ steps.final.outputs.gallery }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          filters: |
            gallery:
              - 'src/ui/**'
              - 'src/dev/**'
              - 'src/index.css'
              - 'tailwind.config.ts'
              - 'e2e/gallery.*.spec.ts'
              - 'e2e/gallery/**'
              - 'e2e/__screenshots__/**'
              - 'playwright.config.ts'
              - 'package*.json'
              - '.github/workflows/ci.yml'
      - id: final
        env:
          CHANGED: ${{ steps.filter.outputs.gallery }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "gallery=true" >> "$GITHUB_OUTPUT"
          else
            echo "gallery=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Token parity (docs/design/tokens.css vs src/index.css)
        run: npm run check:tokens
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Import transforms and safety guard (fixtures only; the load test runs in db.yml)
        run: npm run test:import
      - name: Build
        run: npm run build

  # U09: visual regression and axe over /dev/gallery, in real Chromium on Ubuntu.
  # Baselines are Linux-only and live in e2e/__screenshots__.
  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.gallery == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium with system dependencies
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system dependencies only (browser restored from cache)
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Regenerate baselines (manual run with update_baselines)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
        run: npx playwright test e2e/gallery.visual.spec.ts --project=w1440 --project=w375 --update-snapshots
      - name: Axe suite (zero violations)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baselines) }}
        run: npx playwright test e2e/gallery.axe.spec.ts --project=w1440 --project=w375
      - name: Visual suite
        id: visual
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baselines) }}
        run: |
          if [ ! -d e2e/__screenshots__ ]; then
            echo "::error::No committed baselines in e2e/__screenshots__. Generating them; download the artifact, commit it, push."
            echo "generated=true" >> "$GITHUB_OUTPUT"
            npx playwright test e2e/gallery.visual.spec.ts --project=w1440 --project=w375 --update-snapshots
            exit 1
          fi
          npx playwright test e2e/gallery.visual.spec.ts --project=w1440 --project=w375
      - name: Upload generated baselines
        if: ${{ always() && (steps.visual.outputs.generated == 'true' || (github.event_name == 'workflow_dispatch' && inputs.update_baselines)) }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: e2e/__screenshots__
          if-no-files-found: ignore
      - name: Upload failure report (diffs and traces)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

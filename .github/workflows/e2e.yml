name: E2E

# The database-backed suites are listed in ONE place, .github/e2e-suites.yml (paths that trigger each suite, plus a rough weight).
# A small `changes` job picks the suites to run and balances them across up to 7 parallel shard jobs (scripts/ci/e2e-matrix.py).
# Each shard boots its own Supabase stack and its own build, then runs its suites one after another with a database reset between
# them (scripts/ci/e2e-run.sh). The final job, "E2E", needs every shard and is the single result to read (and to require).
# Pushes to main and manual runs (Actions, E2E, Run workflow) run every suite. See docs/CI.md.
# No pull_request trigger: a push to a PR branch already runs this, and a second run doubled the minutes.
on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "e2e/**"
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "supabase/config.toml"
      - "supabase/functions/admin-users/**"
      - "playwright.config.ts"
      - "vite.config.ts"
      - "index.html"
      - "public/**"
      - "vercel.json"
      - "package*.json"
      - ".github/workflows/e2e.yml"
      - ".github/e2e-suites.yml"
      - "scripts/ci/e2e-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      any: ${{ steps.matrix.outputs.any }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          filters: .github/e2e-suites.yml
      - id: matrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          SHARED: ${{ steps.filter.outputs.shared }}
        run: |
          RUN_ALL=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$SHARED" = "true" ]; then RUN_ALL=true; fi
          RUN_ALL=$RUN_ALL python3 scripts/ci/e2e-matrix.py .github/e2e-suites.yml

  shard:
    name: E2E shard ${{ matrix.shard }}
    needs: changes
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium with system dependencies
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system dependencies only (browser restored from cache)
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start local Supabase (db, auth, rest, storage); a fresh start applies migrations and seed
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime

      - name: Start the admin-users function (the Team screen calls it); it warms up while the app builds
        run: |
          # --no-verify-jwt: the function authenticates the bearer token itself and then requires an
          # active admin (same as functions.yml). The preview server's origin is on its allow-list.
          nohup npx supabase functions serve admin-users --no-verify-jwt --env-file supabase/functions/local.env > "$RUNNER_TEMP/functions-serve.log" 2>&1 &

      - name: Build the app against the local stack
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" npm run build

      - name: Wait for the admin-users function
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: http://127.0.0.1:4173' "$API_URL/functions/v1/admin-users" || true)
            if [ "$code" = "204" ]; then echo "function ready after $i tries"; exit 0; fi
            sleep 2
          done
          echo "admin-users did not become ready"; cat "$RUNNER_TEMP/functions-serve.log" || true; exit 1

      - name: Playwright suites for this shard (${{ matrix.suites }})
        run: bash scripts/ci/e2e-run.sh ${{ matrix.suites }}

      - name: Upload reports and review screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-shard-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
            review-shots
          if-no-files-found: ignore

      - name: Function log
        if: always()
        run: cat "$RUNNER_TEMP/functions-serve.log" || true

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  # The one result to read (and to require): green when every shard passed or nothing needed to run.
  e2e:
    name: E2E
    needs: [changes, shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All shards passed (or none needed)
        run: |
          echo "changes=${{ needs.changes.result }} shards=${{ needs.shard.result }}"
          [ "${{ needs.changes.result }}" = "success" ] && { [ "${{ needs.shard.result }}" = "success" ] || [ "${{ needs.shard.result }}" = "skipped" ]; }

name: E2E

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Start local Supabase (db, auth, rest, storage)
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime

      - name: Rebuild database (migrations and seed fixtures)
        run: npx supabase db reset --local

      - name: Serve the admin-users function (the Team screen calls it)
        run: |
          # --no-verify-jwt: the function authenticates the bearer token itself and then requires an
          # active admin (same as functions.yml). The preview server's origin is on its allow-list.
          nohup npx supabase functions serve admin-users --no-verify-jwt > "$RUNNER_TEMP/functions-serve.log" 2>&1 &
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: http://127.0.0.1:4173' "$API_URL/functions/v1/admin-users" || true)
            if [ "$code" = "204" ]; then echo "function ready after $i tries"; exit 0; fi
            sleep 2
          done
          echo "admin-users did not become ready"; cat "$RUNNER_TEMP/functions-serve.log" || true; exit 1

      - name: Build the app against the local stack
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright (auth project)
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          E2E_SUITE=auth npx playwright test --project=auth

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-auth
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Function log
        if: always()
        run: cat "$RUNNER_TEMP/functions-serve.log" || true

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

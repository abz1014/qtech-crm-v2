name: DB

on:
  push:
    branches: ["**"]
    paths:
      - "supabase/**"
      - "src/types/database.ts"
      - "package*.json"
      - ".github/workflows/db.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Start local Supabase (db, auth, rest, storage)
        run: |
          start=$(date +%s)
          npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime
          echo "supabase start took $(( $(date +%s) - start ))s"

      - name: Rebuild database from zero (all migrations)
        run: npx supabase db reset --local

      - name: Lint database (fail on error)
        run: npx supabase db lint --local --level warning --fail-on error

      - name: pgTAP tests
        run: npx supabase test db

      - name: S19 supplier-memory timing (prints the p95 numbers)
        run: |
          URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$URL" -v ON_ERROR_STOP=1 -c "create extension if not exists pgtap with schema extensions"
          PGOPTIONS='-c search_path=public,extensions' psql "$URL"             -v ON_ERROR_STOP=1 -f supabase/tests/0024_supplier_memory_perf.test.sql

      - name: R12 search timing (prints the p95 numbers)
        run: |
          URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          PGOPTIONS='-c search_path=public,extensions' psql "$URL" -v ON_ERROR_STOP=1 -f supabase/tests/0034_search_all_perf.test.sql

      - name: Generate types
        run: npx supabase gen types typescript --local > "$RUNNER_TEMP/types.ts"

      - name: Upload generated types
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-types
          path: ${{ runner.temp }}/types.ts
          if-no-files-found: ignore

      - name: Generated types match src/types/database.ts
        run: diff -u src/types/database.ts "$RUNNER_TEMP/types.ts"

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

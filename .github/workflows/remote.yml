name: Remote

# S15: push migrations to the remote Supabase project. Manual only, owner-approved
# (the `production` environment gates the run). Never triggered by push or schedule.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = link, list, dry-run, parity, types. push = also apply migrations."
        type: choice
        options: [check, push]
        default: check

permissions:
  contents: read

concurrency:
  group: remote-supabase
  cancel-in-progress: false

jobs:
  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Guard - target must be the new CRM project
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_PROJECT_REF is empty"; exit 1
          fi
          echo "::add-mask::$SUPABASE_PROJECT_REF"
          if [ "$SUPABASE_PROJECT_REF" = "vptyhluvgnjpvkcbhxsf" ]; then
            echo "::error::Refusing: ref is the OLD CRM project. Never target it."; exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" != "yafbphagorydbitfgfmg" ]; then
            echo "::error::Refusing: ref is not the expected Q-Tech CRM v2 project."; exit 1
          fi
          case "$MODE" in check|push) ;; *) echo "::error::bad mode"; exit 1 ;; esac
          echo "Guard passed. mode=$MODE"

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # Supabase CLI version is pinned by package-lock.json, same as db.yml.
      - run: npm ci

      - name: Keep seed local - disable config seed and refuse seed flags
        run: |
          set -euo pipefail
          # seed.sql holds local test fixtures. Disable it in this ephemeral checkout
          # so even a stray --include-seed could not load it.
          sed -i '/^\[db\.seed\]/,/^\[/ s/^enabled *= *true/enabled = false/' supabase/config.toml
          awk '/^\[db\.seed\]/{f=1;next} /^\[/{f=0} f && /^enabled/' supabase/config.toml | grep -Eq '^enabled *= *false' \
            || { echo "::error::could not disable [db.seed]"; exit 1; }
          if grep -E '^\s*(run: )?(npx )?supabase .*--include-seed' .github/workflows/remote.yml; then
            echo "::error::--include-seed must never be used here"; exit 1
          fi
          echo "Seed disabled for this run."

      - name: Link remote project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: Migration list (before)
        run: npx supabase migration list

      - name: Dry run (the plan)
        run: npx supabase db push --dry-run

      - name: Push migrations
        if: ${{ inputs.mode == 'push' }}
        run: npx supabase db push

      - name: Parity - every local migration applied remotely, none extra
        run: |
          set -euo pipefail
          npx supabase migration list | tee "$RUNNER_TEMP/list.txt"
          ls supabase/migrations/*.sql | sed -E 's#.*/([0-9]+)_.*#\1#' | sort > "$RUNNER_TEMP/files.txt"
          # Rows look like "  local | remote | time". Keep rows whose first cell is a version.
          awk -F'|' '{l=$1;r=$2;gsub(/[ `\t]/,"",l);gsub(/[ `\t]/,"",r)} l ~ /^[0-9]+$/ || r ~ /^[0-9]+$/ {print l "," r}' "$RUNNER_TEMP/list.txt" > "$RUNNER_TEMP/rows.txt"
          if [ ! -s "$RUNNER_TEMP/rows.txt" ]; then
            echo "::error::parity: parsed zero migration rows from the list (format changed?)"; exit 1
          fi
          fail=0
          while IFS=, read -r l r; do
            if [ -z "$r" ]; then echo "::error::local $l NOT applied remotely"; fail=1
            elif [ -z "$l" ]; then echo "::error::remote $r has NO local file (extra)"; fail=1
            elif [ "$l" != "$r" ]; then echo "::error::mismatch $l vs $r"; fail=1; fi
          done < "$RUNNER_TEMP/rows.txt"
          cut -d, -f1 "$RUNNER_TEMP/rows.txt" | grep -v '^$' | sort > "$RUNNER_TEMP/listed.txt"
          diff "$RUNNER_TEMP/files.txt" "$RUNNER_TEMP/listed.txt" || { echo "::error::migration files differ from the list"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "Parity OK: $(wc -l < "$RUNNER_TEMP/files.txt") local migrations, all applied, none extra."

      - name: Schema drift check (linked project vs migrations)
        run: |
          set -uo pipefail
          # Diffs the remote schema against the migrations via a shadow database.
          # Empty stdout means no drift. Anything left after the allowlist filter is drift and fails the run.
          npx supabase db diff --linked --schema public,storage > "$RUNNER_TEMP/drift.sql"
          rc=$?
          echo "---- drift output ----"
          cat "$RUNNER_TEMP/drift.sql"
          echo "---- end ----"
          if [ "$rc" -ne 0 ]; then echo "::error::db diff failed (exit $rc)"; exit 1; fi
          # Drop statements for known platform-managed objects (supabase/drift-allowlist.txt).
          bash scripts/filter-drift.sh "$RUNNER_TEMP/drift.sql" supabase/drift-allowlist.txt > "$RUNNER_TEMP/drift.filtered.sql"
          echo "---- drift after allowlist ----"
          cat "$RUNNER_TEMP/drift.filtered.sql"
          echo "---- end ----"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/drift.filtered.sql"; then
            echo "::error::schema drift detected between remote and migrations"; exit 1
          fi
          echo "Schema drift: none."

      # Informational only. The hosted generator differs from the local CLI's, so
      # byte equality with src/types/database.ts is not a valid gate.
      - name: Generate remote types (informational)
        if: always()
        continue-on-error: true
        run: npx supabase gen types typescript --project-id "$SUPABASE_PROJECT_REF" > "$RUNNER_TEMP/remote-types.ts"

      - name: Upload remote types and drift output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remote-types
          path: |
            ${{ runner.temp }}/remote-types.ts
            ${{ runner.temp }}/drift.sql
          if-no-files-found: ignore

name: Journeys dev (temporary, deleted before merge)

on:
  push:
    branches: ["p9/p03-journeys"]
    paths:
      - "e2e/journeys/**"
      - "src/**"
      - ".github/workflows/journeys-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journeys-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium with system dependencies
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system dependencies only
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime
      - run: npx supabase db reset --local
      - name: Build
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" npm run build
      - run: command -v pdftoppm && command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Playwright (journeys)
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          E2E_SUITE=journeys REVIEW_DIR=review-shots PLAYWRIGHT_HTML_REPORT=playwright-report/journeys npx playwright test --project=journeys --output=test-results/journeys
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journeys
          path: |
            playwright-report
            test-results
            review-shots
          if-no-files-found: ignore
      - if: always()
        run: npx supabase stop --no-backup

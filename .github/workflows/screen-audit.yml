name: Screen audit

# Manual only: Actions > Screen audit > Run workflow, or `gh workflow run screen-audit.yml -f ref=<branch, tag or SHA>`.
# Measures the real built app at `ref` on the local CI stack with seeded data: every main screen and key state, per role, at each
# viewport; above-the-fold and full-page screenshots, DOM metrics and axe. One job per role (each with its own stack), then one
# job merges the parts into audit-results.json and audit-report.md, uploaded as the `screen-audit` artifact.
# The audit code (e2e/audit, scripts/audit) always comes from the commit this workflow runs from, so any ref can be audited,
# including one made before the audit existed. Never on push or pull request.
# The last step of the report job is the layout gate (report.mjs --gate layout): the run is red when a page scrolls twice, text hangs out
# of a box, text sits on a control or a page scrolls sideways. The `set` input "layout" is the quick gate run: admin only, five desktop
# widths, the money screens and dialogs, no axe and no full-page shots (about 10 minutes). Older rubric targets stay advisory. See docs/audit/SCREEN_AUDIT.md.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA of the app to audit
        required: true
        default: main
      roles:
        description: Roles (space separated, from admin sales engineer)
        required: false
        default: admin sales engineer
      viewports:
        description: Viewports as WIDTHxHEIGHT (space separated)
        required: false
        default: 1440x900 375x812 320x640
      set:
        description: "standard: the audit above. layout: admin at 768 1024 1280 1440 1600 on the layout screens and dialogs (viewports, roles and screens inputs are ignored)"
        required: false
        type: choice
        options:
          - standard
          - layout
          - opened
        default: standard
      screens:
        description: Only visits or screens whose id matches this regular expression (empty for all)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: screen-audit-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      roles: ${{ steps.roles.outputs.json }}
    steps:
      - id: roles
        env:
          ROLES: ${{ inputs.set == 'layout' && 'admin' || inputs.roles }}
        run: |
          json=$(python3 -c 'import json, os; r = [x for x in os.environ["ROLES"].split() if x in ("admin", "sales", "engineer")]; print(json.dumps(r or ["admin", "sales", "engineer"]))')
          echo "roles: $json"
          echo "json=$json" >> "$GITHUB_OUTPUT"

  audit:
    name: Audit (${{ matrix.role }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.plan.outputs.roles) }}
    steps:
      - name: Check out the app to audit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Check out the audit code (this workflow's commit)
        uses: actions/checkout@v7
        with:
          path: .audit-tools
          sparse-checkout: |
            e2e/audit
            scripts/audit

      - name: Use this commit's audit code on the app
        run: |
          echo "AUDIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          rm -rf e2e/audit scripts/audit
          mkdir -p e2e scripts
          cp -r .audit-tools/e2e/audit e2e/audit
          cp -r .audit-tools/scripts/audit scripts/audit
          rm -rf .audit-tools

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium with system dependencies
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system dependencies only (browser restored from cache)
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start local Supabase (db, auth, rest, storage); a fresh start applies migrations and seed
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime

      - name: Start the admin-users function (the Team screen calls it)
        run: nohup npx supabase functions serve admin-users --no-verify-jwt --env-file supabase/functions/local.env > "$RUNNER_TEMP/functions-serve.log" 2>&1 &

      - name: Build the app against the local stack
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_ANON_KEY="$ANON_KEY" npm run build

      - name: Wait for the admin-users function
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: http://127.0.0.1:4173' "$API_URL/functions/v1/admin-users" || true)
            if [ "$code" = "204" ]; then echo "function ready after $i tries"; exit 0; fi
            sleep 2
          done
          echo "::warning::admin-users did not become ready; the Team screen will show its error state"
          cat "$RUNNER_TEMP/functions-serve.log" || true

      - name: Screen audit (${{ matrix.role }})
        env:
          AUDIT_ROLES: ${{ matrix.role }}
          AUDIT_VIEWPORTS: ${{ inputs.set == 'layout' && '768x1024 1024x768 1280x800 1440x900 1600x900' || inputs.viewports }}
          AUDIT_SCREENS: ${{ inputs.set == 'layout' && '' || inputs.screens }}
          AUDIT_SET: ${{ inputs.set == 'layout' && 'layout' || inputs.set == 'opened' && 'opened' || '' }}
          AUDIT_AXE: ${{ inputs.set != 'standard' && '0' || '1' }}
          AUDIT_FULL: ${{ inputs.set == 'layout' && '0' || '1' }}
          AUDIT_REF: ${{ inputs.ref }}
          AUDIT_DIR: audit-out
          # The preview server sends the production Content-Security-Policy, as in the E2E suites.
          E2E_CSP: "1"
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          npx playwright test -c e2e/audit/playwright.audit.config.ts

      - name: Upload this role's part
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screen-audit-part-${{ matrix.role }}
          path: audit-out
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload the Playwright report (for debugging the audit itself)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screen-audit-playwright-${{ matrix.role }}
          path: |
            playwright-report/audit
            test-results/audit
          retention-days: 3
          if-no-files-found: ignore

      - name: Function log
        if: always()
        run: cat "$RUNNER_TEMP/functions-serve.log" || true

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  report:
    name: Report
    needs: audit
    if: ${{ always() && needs.audit.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/audit

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Download the parts
        uses: actions/download-artifact@v8
        with:
          pattern: screen-audit-part-*
          merge-multiple: true
          path: audit-out

      - name: Build the report
        env:
          REF: ${{ inputs.ref }}
        run: |
          node scripts/audit/report.mjs audit-out --ref "$REF"
          cat audit-out/audit-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the audit
        uses: actions/upload-artifact@v7
        with:
          name: screen-audit
          path: audit-out
          retention-days: 30

      # Red when the layout gate finds anything (the findings are in the log, in the summary above and in audit-report.md).
      - name: Layout gate
        # The opened set (panels after a click) reports layout findings but does not fail the run; the standard and layout sets still gate.
        continue-on-error: ${{ inputs.set == 'opened' }}
        run: node scripts/audit/report.mjs audit-out --gate layout

      # Red when a clarity number is worse than its budget (scripts/audit/clarity-budgets.json); a screen with no budget is listed, not failed.
      - name: Clarity ratchet
        if: ${{ inputs.set != 'layout' }}
        run: node scripts/audit/report.mjs audit-out --gate clarity

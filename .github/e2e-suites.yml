# The ONE place that defines an E2E suite (read by .github/workflows/e2e.yml and scripts/ci/e2e-matrix.py).
#
# Each key is a Playwright project name from playwright.config.ts. The paths under it decide when that suite runs on a push
# (it always runs on main and on a manual dispatch). The optional "# weight=N" is the measured seconds the suite takes with its
# database reset (median of 5 shard runs on 2026-10-22, refresh it from the "##[group]suite" log timestamps); it is only used to balance suites across the parallel shards (default 50). `shared` is special: a change there
# runs every suite. Do NOT add anything else at column 0 except suite keys. See docs/CI.md.
shared:
  - 'src/**'
  - 'e2e/support/**'
  - 'e2e/support.ts'
  - 'supabase/migrations/**'
  - 'supabase/seed.sql'
  - 'supabase/config.toml'
  - 'playwright.config.ts'
  - 'package*.json'
  - '.github/workflows/e2e.yml'
  - '.github/e2e-suites.yml'
  - 'scripts/ci/e2e-*'
  - 'vercel.json'
  - 'vite.config.ts'
  - 'app-version.json'
